{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  <div class="pagination-navigation">
    {% if page_obj.has_previous %}<a class="pagination-button" href="?page={{ page_obj.previous_page_number }}">Previous</a>{% else %}<span class="pagination-button disabled">Previous</span>{% endif %}
    <span class="pagination-summary">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="pagination-button" href="?page={{ page_obj.next_page_number }}">Next</a>{% else %}<span class="pagination-button disabled">Next</span>{% endif %}
  </div>
</nav>
{% endif %}
